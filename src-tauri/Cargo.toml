[package]
name = "mio-jisho"
version = "0.1.1"
description = "Mio Jisho desktop application"
authors = ["Riko-Neko"]
edition = "2021"

[lib]
name = "mio_jisho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
